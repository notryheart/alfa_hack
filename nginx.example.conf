# Example only. Adapt the root and upstream to the deployment environment.
server {
    listen 80;
    server_name localhost;
    root /srv/credit-cabinet/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
